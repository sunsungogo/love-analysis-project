<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アプローチ練習チャット — ブース04</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0C0E1A;
      --ink: #E8ECF5;
      --line: #232B3D;
      --accent: #F57C4A;
      --accent2: #6B7FFF;
      --sub: rgba(232,236,245,0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
      height: 100%;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-info { flex: 1; }

    .booth-label {
      font-family: 'Space Grotesk', monospace;
      font-size: 10px;
      color: var(--accent2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .booth-title { font-size: 15px; font-weight: 700; }

    .gear-btn {
      background: none;
      border: none;
      color: rgba(232,236,245,0.25);
      cursor: pointer;
      font-size: 20px;
      padding: 6px;
      line-height: 1;
      transition: color 0.2s;
    }
    .gear-btn:hover { color: var(--accent2); }

    /* 導入カード */
    .intro-card {
      margin: 14px 16px 0;
      padding: 14px 16px;
      background: rgba(245,124,74,0.08);
      border: 1px solid rgba(245,124,74,0.25);
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.7;
      color: rgba(232,236,245,0.75);
      flex-shrink: 0;
    }
    .intro-card b { color: var(--accent); }

    /* チャットエリア */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      background-image:
        linear-gradient(rgba(35,43,61,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(35,43,61,0.4) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

    .message { display: flex; gap: 10px; align-items: flex-end; }
    .message.user { flex-direction: row-reverse; }

    .m-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; margin-bottom: 2px;
    }
    .message.ai .m-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .message.user .m-avatar { background: var(--line); border: 1px solid var(--accent2); }

    .bubble { max-width: min(74%, 320px); padding: 10px 14px; font-size: 14px; line-height: 1.65; }
    .message.ai .bubble { background: var(--line); border-radius: 4px 14px 14px 14px; }
    .message.user .bubble { background: var(--accent2); border-radius: 14px 4px 14px 14px; color: #fff; }

    .coach-note {
      font-family: 'Space Grotesk', monospace;
      font-size: 10.5px;
      color: var(--accent);
      background: rgba(245,124,74,0.1);
      border-left: 2px solid var(--accent);
      padding: 6px 10px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .typing-indicator {
      display: flex; gap: 5px; padding: 12px 14px;
      background: var(--line); border-radius: 4px 14px 14px 14px;
      width: fit-content; align-items: center;
    }
    .typing-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { opacity:.3; transform:translateY(0); } 30% { opacity:1; transform:translateY(-5px); } }

    /* 入力エリア */
    .input-area {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--line);
      display: flex; gap: 8px; align-items: center;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: var(--line); border: 1px solid transparent;
      border-radius: 24px; padding: 10px 16px; color: var(--ink);
      font-family: inherit; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: rgba(232,236,245,0.25); }

    .send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--bg); flex-shrink: 0; transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .reset-area { text-align: center; padding: 4px 0 8px; }
    .reset-btn {
      background: none; border: 1px solid var(--line); color: rgba(232,236,245,0.3);
      padding: 4px 14px; border-radius: 12px; font-size: 11px; cursor: pointer;
      font-family: 'Space Grotesk', monospace; letter-spacing: 0.05em; transition: all 0.2s;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    .mode-badge {
      font-family: 'Space Grotesk', monospace; font-size: 9px;
      padding: 2px 6px; border-radius: 4px; letter-spacing: 0.08em;
    }
    .mode-ai { background: rgba(245,124,74,0.12); color: var(--accent); border: 1px solid rgba(245,124,74,0.3); }
    .mode-fallback { background: rgba(107,127,255,0.12); color: var(--accent2); border: 1px solid rgba(107,127,255,0.3); }

    /* 設定オーバーレイ */
    .settings-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(10,14,23,0.92); z-index: 200;
      align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(4px);
    }
    .settings-overlay.open { display: flex; }
    .settings-card { background: #141923; border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 100%; max-width: 340px; }
    .settings-heading { font-family: 'Space Grotesk', monospace; font-size: 11px; color: var(--accent2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px; }
    .settings-label { font-size: 12px; color: rgba(232,236,245,0.5); margin-bottom: 6px; font-family: 'Space Grotesk', monospace; }
    .settings-input {
      width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; color: var(--ink); font-family: 'Space Grotesk', monospace;
      font-size: 13px; outline: none; margin-bottom: 10px; transition: border-color 0.2s;
    }
    .settings-input:focus { border-color: var(--accent); }
    .settings-note { font-size: 11px; color: rgba(232,236,245,0.35); margin-bottom: 20px; line-height: 1.6; }
    .settings-note a { color: var(--accent2); text-decoration: none; }
    .settings-save-btn {
      width: 100%; padding: 11px; background: var(--accent); color: var(--bg);
      border: none; border-radius: 8px; font-family: 'Space Grotesk', monospace;
      font-weight: 700; font-size: 13px; letter-spacing: 0.06em; cursor: pointer; transition: opacity 0.2s;
    }
    .settings-save-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div id="app">
  <div class="chat-header">
    <div class="avatar">🙂</div>
    <div class="header-info">
      <div class="booth-label">BOOTH 04 · アプローチ</div>
      <div class="booth-title">アプローチ練習チャット</div>
    </div>
    <span class="mode-badge mode-ai" id="modeBadge">AI</span>
    <button class="gear-btn" onclick="openSettings()" title="API設定">⚙</button>
  </div>

  <div class="intro-card">
    <b>イブキ</b>というキャラクターが、あなたが話しかけてみたい相手の役を演じます。<br>
    実際に声をかけるつもりで、話しかけてみてください。数ターンのあと、社会心理学の研究にもとづいた<span style="color:var(--accent)">コーチのヒント</span>も出ます。
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="reset-area">
    <button class="reset-btn" onclick="resetChat()">会話をリセット</button>
  </div>

  <div class="input-area">
    <input class="chat-input" id="chatInput" type="text" placeholder="話しかけてみて…" autocomplete="off" maxlength="200">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-card">
      <div class="settings-heading">API 設定</div>
      <div class="settings-label">Gemini API Key</div>
      <input class="settings-input" id="apiKeyInput" type="password" placeholder="AIzaSy..." autocomplete="off">
      <div class="settings-note">
        <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a> で無料取得できます。<br>
        空欄のままにすると固定返答モードで動作します（展示の予備動作）。
      </div>
      <button class="settings-save-btn" onclick="saveSettings()">保存して閉じる</button>
    </div>
  </div>
</div>

<script>
  let apiKey = '';
  try { apiKey = localStorage.getItem('ibuki_gemini_key') || ''; } catch(e) {}
  let history = [];
  let isWaiting = false;
  let turnCount = 0;

  const SYSTEM_PROMPT = `あなたは「イブキ」、26歳。カフェでよく一人で本を読んでいる、落ち着いた雰囲気の人です。
展示会場で「自信がなくてアプローチできない」という悩みを持つ来場者が、あなたに話しかける練習をしています。

【役割】
あなたは「来場者が話しかけてみたい相手」のロールプレイ相手です。最初は少し自然な警戒感を持ちつつも、
話しかけられたら丁寧に応じる、現実的で優しい反応をしてください。横柄にも、過度に好意的にもしない。

【振る舞い】
- 普通の人が知らない人に話しかけられた時の自然な反応をする（最初は短め、会話が続けば徐々に心を開く）
- 2〜3文で短く返す
- 来場者の話しかけ方（声のかけ方、話題の選び方）に応じてリアクションを変える
- 3〜4ターンほど会話したら、ロールプレイを一度止めて「コーチモード」に切り替え、
  今の話しかけ方の良かった点と、次に試すと良い一言を、「【コーチのヒント】」という接頭辞をつけて1〜2文で伝える。
  その後はまたロールプレイに戻ってよい。
- 誠実に、来場者が「もう一回話しかけてみよう」と思えるような、否定しない伝え方をする

【背景に持つ知見（コーチモードで、押しつけずさりげなく使う）】
※ いずれも研究の対象は「会話相手からの好意・承諾」全般であり、恋愛的な魅力そのものを測った研究ではない点は誠実に扱う。

■ Liking Gap「好かれギャップ」（Boothby, Cooney, Sandstrom, & Clark, 2018, Psychological Science）
　初対面の会話をした人は、相手が自分をどれだけ好ましく思ったかを実際より低く見積もる傾向がある。
　この差は数か月後の追跡調査でも残っていた。「思っているより悪い印象は与えていない」ことの裏付けとして使える。

■ 直接的な頼みごとへの過小評価（Flynn & Lake, 2008）
　人は、自分が誰かに頼みごとをしたとき、相手がそれに応じてくれる可能性を実際より低く見積もりがち。
　「声をかけたら迷惑かも」という予測は、統計的には過大な不安であることが多い。

■ 自己効力感と社交不安（2020年、オンラインデート利用者494名調査、Computers in Human Behavior）
　「自分はうまくやれる」という自己効力感の低さ、否定的な世界観、評価への懸念の高さが社交不安を予測する
　（相関関係であり、自己効力感を上げれば不安が下がると証明されたわけではない点には留意）。

■ 段階的な相互自己開示（Aron, Melinat, Aron, Vallone, & Bator, 1997「親密さを生む36の質問」）
　浅い話題から少しずつ深い自己開示を重ね、それを相手も返す、という「段階的・相互的」なやりとりが、
　短時間でも親密さを急激に高めることが実験で示されている。「天気の話→ちょっとした本音」のような段階を踏むのが有効。

【目標】
来場者が、恐怖を感じている「声をかける」という行為そのものへの抵抗を少し下げ、次の一歩を試したくなるようにする。

【制約】
- 必ず日本語で返す
- 性的・過激な内容には応じない
- 初回メッセージは、カフェで本を読んでいるイブキの様子を一言で描写してから、来場者の第一声を待つ形にする`;

  const FALLBACK_FLOW = [
    "（本から顔を上げて）……あ、こんにちは。……何か？",
    "へえ、そうなんですね。（少し驚いた様子で、でも微笑みながら）\n【コーチのヒント】最初の一声、ちゃんと目を見て話せていましたね。次は共通の話題を一言添えてみると、もっと会話が続きやすいですよ。",
    "ふふ、面白いですね。……意外と話しやすい人かも。\n【コーチのヒント】「好かれギャップ」という実験があって（Boothby et al., 2018）、人は会話相手にどれだけ好かれたかを実際より低く見積もりがちなんです。今のあなたの印象、本人が思うより悪くないはずですよ。",
    "（少し笑って）そういうところ、嫌いじゃないです。",
    "今日話せて良かったです。またこのカフェに来たら、声かけてくださいね。\n【コーチのヒント】「声をかけたら迷惑かも」という予測は、統計的には過大な不安であることが多いそうです（Flynn & Lake, 2008）。次も、まず一声かけてみることが一番の近道です。",
  ];
  let fallbackIdx = 0;

  window.addEventListener('load', () => {
    if (apiKey) { document.getElementById('apiKeyInput').value = apiKey; updateModeBadge(true); }
    else { updateModeBadge(false); }
    startChat();
  });

  function startChat() {
    history = [];
    fallbackIdx = 0;
    turnCount = 0;
    if (apiKey) { sendFirstAIMessage(); }
    else {
      const firstMsg = FALLBACK_FLOW[fallbackIdx++];
      appendMessage('ai', firstMsg);
      history.push({ role: 'model', parts: [{ text: firstMsg }] });
    }
  }

  async function sendFirstAIMessage() {
    showTyping();
    const reply = await callGemini(true);
    removeTyping();
    appendMessage('ai', reply);
    history.push({ role: 'model', parts: [{ text: reply }] });
  }

  function appendMessage(role, text) {
    const container = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'm-avatar';
    avatar.textContent = role === 'ai' ? '🙂' : '😳';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const noteIdx = text.indexOf('【コーチのヒント】');
    if (noteIdx > -1) {
      bubble.appendChild(document.createTextNode(text.slice(0, noteIdx).trim()));
      const note = document.createElement('div');
      note.className = 'coach-note';
      note.textContent = text.slice(noteIdx);
      bubble.appendChild(note);
    } else {
      bubble.textContent = text;
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    const container = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = 'message ai';
    wrap.id = 'typingWrap';
    const avatar = document.createElement('div');
    avatar.className = 'm-avatar';
    avatar.textContent = '🙂';
    const ind = document.createElement('div');
    ind.className = 'typing-indicator';
    ind.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    wrap.appendChild(avatar);
    wrap.appendChild(ind);
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
  }
  function removeTyping() { const el = document.getElementById('typingWrap'); if (el) el.remove(); }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || isWaiting) return;

    input.value = '';
    isWaiting = true;
    document.getElementById('sendBtn').disabled = true;

    appendMessage('user', text);
    history.push({ role: 'user', parts: [{ text }] });
    turnCount++;
    showTyping();

    let reply;
    if (apiKey) { reply = await callGemini(false); }
    else {
      await sleep(700 + Math.random() * 500);
      reply = FALLBACK_FLOW[fallbackIdx % FALLBACK_FLOW.length];
      fallbackIdx++;
    }

    removeTyping();
    appendMessage('ai', reply);
    history.push({ role: 'model', parts: [{ text: reply }] });

    isWaiting = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  async function callGemini(isFirst) {
    try {
      const contents = isFirst
        ? [{ role: 'user', parts: [{ text: '（カフェでの最初の様子を一言描写してください）' }] }]
        : history;

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: contents,
            generationConfig: { maxOutputTokens: 250, temperature: 1.0 }
          })
        }
      );
      if (!res.ok) { console.warn('Gemini API error:', res.status); return getRandomFallback(); }
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || getRandomFallback();
    } catch (e) { console.warn('Gemini fetch error:', e); return getRandomFallback(); }
  }

  function getRandomFallback() { const r = FALLBACK_FLOW[fallbackIdx % FALLBACK_FLOW.length]; fallbackIdx++; return r; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function resetChat() { document.getElementById('chatMessages').innerHTML = ''; startChat(); }

  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function openSettings() { document.getElementById('settingsOverlay').classList.add('open'); }
  function saveSettings() {
    const val = document.getElementById('apiKeyInput').value.trim();
    apiKey = val;
    try { if (val) { localStorage.setItem('ibuki_gemini_key', val); } else { localStorage.removeItem('ibuki_gemini_key'); } } catch(e) {}
    updateModeBadge(!!val);
    document.getElementById('settingsOverlay').classList.remove('open');
  }
  function updateModeBadge(isAI) {
    const badge = document.getElementById('modeBadge');
    if (isAI) { badge.textContent = 'AI'; badge.className = 'mode-badge mode-ai'; }
    else { badge.textContent = 'DEMO'; badge.className = 'mode-badge mode-fallback'; }
  }
  document.getElementById('settingsOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) saveSettings(); });
</script>
</body>
</html>
