<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコード一覧 — 恋愛未来実験展</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:    #FAFAF5;
      --paper: #FFFFFF;
      --ink:   #1C1814;
      --sub:   #7A7260;
      --line:  #DDD5C0;
      --red:   #C0392B;
      --sans:  'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
      --mono:  'Space Grotesk', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      padding: 40px max(20px, env(safe-area-inset-left, 0px));
      padding-right: max(20px, env(safe-area-inset-right, 0px));
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 1.5px solid var(--line);
    }

    .ph-kicker {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 10px;
    }

    .ph-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .ph-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      letter-spacing: 0.06em;
    }

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .qr-card {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 22px 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .qr-num {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 6px;
    }

    .qr-name {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
      color: var(--ink);
      margin-bottom: 18px;
    }

    .qr-box {
      width: 168px;
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      background: var(--paper);
    }

    .qr-box canvas,
    .qr-box img {
      width: 168px !important;
      height: 168px !important;
    }

    .qr-divider {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin-bottom: 12px;
    }

    .qr-url {
      font-family: var(--mono);
      font-size: 8.5px;
      color: var(--sub);
      text-align: center;
      line-height: 1.6;
      word-break: break-all;
    }

    .page-footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 9px;
      color: var(--sub);
      letter-spacing: 0.08em;
    }

    @media print {
      body { background: white; padding: 20px; }
      .qr-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .qr-card { break-inside: avoid; border: 1px solid #ccc; border-radius: 8px; padding: 16px 12px 12px; }
      .page-footer { margin-top: 20px; }
    }

    @media (max-width: 480px) {
      .qr-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .qr-card { padding: 16px 12px 14px; }
      .qr-box { width: 130px; height: 130px; }
      .qr-box canvas, .qr-box img { width: 130px !important; height: 130px !important; }
      .qr-name { font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <div class="ph-kicker">Love Analysis Project · 100BANCH採択</div>
  <div class="ph-title">恋愛未来実験展</div>
  <div class="ph-sub">デジタルツール QRコード一覧</div>
</div>

<div class="qr-grid" id="grid"></div>

<div class="page-footer">
  各ブースのスマホツールはQRコードから直接アクセスできます<br>
  sunsungogo.github.io/love-analysis-project
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const BASE = 'https://sunsungogo.github.io/love-analysis-project/';

  const BOOTHS = [
    { n: 'Booth 01', name: '都合のいい人\n診断室',       file: 'booth-01-convenient-game.html' },
    { n: 'Booth 02', name: '思わせぶり度\nセンサー',     file: 'booth-02-ambiguous-game.html'  },
    { n: 'Booth 04', name: 'アプローチ\n練習チャット',   file: 'booth-04-approach-game.html'   },
    { n: 'Booth 05', name: 'コミュニティ\n相性診断',   file: 'booth-05-community-game.html' },
    { n: 'Booth 06', name: '関係性\n温度チェック',      file: 'booth-06-timing-game.html'    },
    { n: 'Booth 07', name: '壁打ち\n相談チャット',       file: 'booth-07-consult-game.html'    },
    { n: 'Booth 10', name: '自己開示\nカード',           file: 'booth-10-openself-game.html'  },
    { n: 'Booth 11', name: '蛙化現象\nチェック',         file: 'booth-11-frog-game.html'      },
    { n: 'Booth 12', name: '失恋\nフェーズ診断',         file: 'booth-12-cheating-game.html'  },
    { n: 'Booth 13', name: 'デート日程\n調整デモ',       file: 'booth-13-datesync-game.html'   },
    { n: 'Booth 14', name: '脈なし\n判定',               file: 'booth-14-noreply-game.html'   },
    { n: 'Booth 15', name: '冷め症状\n診断',             file: 'booth-15-cooling-game.html'   },
    { n: 'EXTRA',    name: '愛の言語\nテスト',           file: 'booth-02-lovelang-game.html'   },
  ];

  const grid = document.getElementById('grid');

  BOOTHS.forEach((b, i) => {
    const url = BASE + b.file;
    const card = document.createElement('div');
    card.className = 'qr-card';
    card.innerHTML =
      `<div class="qr-num">${b.n}</div>` +
      `<div class="qr-name" style="white-space:pre-line">${b.name}</div>` +
      `<div class="qr-box" id="qr-${i}"></div>` +
      `<div class="qr-divider"></div>` +
      `<div class="qr-url">${url}</div>`;
    grid.appendChild(card);

    new QRCode(document.getElementById(`qr-${i}`), {
      text: url,
      width: 168,
      height: 168,
      colorDark: '#1C1814',
      colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.M
    });
  });
</script>
</body>
</html>
